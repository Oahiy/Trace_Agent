name: traceagent-day3
services:
  database:
    # pgvector 0.8.7, PostgreSQL 18/bookworm; verified image, no floating tag.
    image: pgvector/pgvector@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    command: ["postgres", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length_on_error=0", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_DB: traceagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the Day 3 prepare command first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # PostgreSQL 18's version-specific data layout lives under /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traceagent"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s
volumes:
  postgres_data:
    name: traceagent-day3-postgres
