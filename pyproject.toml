[project]
name = "trace-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi[standard]==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pypdf[fonts]==6.20.1",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.4",
    "rq==2.12.0",
    "redis==8.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".cache/pytest"
markers = ["database: requires the isolated real PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".cache/ruff"
preview = false
force-exclude = true
extend-exclude = ["sources", ".cache", "learn.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
